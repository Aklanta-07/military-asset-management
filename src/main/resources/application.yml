# =============================================================================
# Military Asset Management System - Application Configuration
# =============================================================================

spring:
  application:
    name: military-asset-management

  # ---------------------------------------------------------------------------
  # Database Configuration - H2 for Dev (Oracle-compatible mode)
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:h2:mem:militaryasset;DB_CLOSE_DELAY=-1;MODE=Oracle;DATABASE_TO_UPPER=false;INIT=CREATE SCHEMA IF NOT EXISTS MILITARY_ASSET\;SET SCHEMA MILITARY_ASSET
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # ---------------------------------------------------------------------------
  # JPA / Hibernate Configuration
  # ---------------------------------------------------------------------------
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_schema: MILITARY_ASSET
    open-in-view: false

  # ---------------------------------------------------------------------------
  # H2 Console (Dev only)
  # ---------------------------------------------------------------------------
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # ---------------------------------------------------------------------------
  # Flyway Database Migration
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: Initial baseline
    validate-on-migrate: true
    clean-disabled: false
    out-of-order: false
    table: flyway_schema_history
    default-schema: MILITARY_ASSET
    schemas: MILITARY_ASSET

  # ---------------------------------------------------------------------------
  # Jackson Configuration
  # ---------------------------------------------------------------------------
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

  # ---------------------------------------------------------------------------
  # Web MVC Configuration
  # ---------------------------------------------------------------------------
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    format:
      date: iso
      date-time: iso
      time: iso

  # ---------------------------------------------------------------------------
  # Servlet / Multipart
  # ---------------------------------------------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# =============================================================================
# Server Configuration
# =============================================================================
server:
  port: 8080
  servlet:
    context-path: /
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false
        same-site: lax
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# =============================================================================
# Application Specific Configuration
# =============================================================================
app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "https://military-asset-frontend.netlify.app"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  security:
    jwt:
      secret: "military-asset-management-super-secret-key-for-jwt-signing-min-256-bits"
      issuer: military-asset-management
      audience: military-asset-client
      access-token-expiry-minutes: 60
      refresh-token-expiry-days: 7

  audit:
    enabled: true
    async: true
    max-payload-size: 10000

  pagination:
    default-page-size: 20
    max-page-size: 100

  dashboard:
    default-date-range-days: 30

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
  level:
    com.militaryassetmgmt: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/military-asset-management.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 100MB

# =============================================================================
# SpringDoc OpenAPI Configuration
# =============================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    try-it-out-enabled: true
  packages-to-scan: com.militaryassetmgmt.controller
  paths-to-match: /api/**
  show-actuator: false
  version: 1.0.0
  title: Military Asset Management API
  description: |
    REST API for Military Asset Management System

    ## Authentication
    This API uses JWT (JSON Web Tokens) for authentication.

    ### Login
    POST /api/auth/login
    {
      "username": "admin",
      "password": "Password@123"
    }

    ### Use Token
    Authorization: Bearer <access_token>

    ## Roles
    - ADMIN: Full access to all bases and operations
    - BASE_COMMANDER: Access to assigned base operations
    - LOGISTICS_OFFICER: Limited to purchases and transfers for assigned base
  contact:
    name: Military Asset Management Team
    email: support@militaryasset.example.com
  license:
    name: Proprietary
    url: https://militaryasset.example.com/license

# =============================================================================
# Actuator / Health Checks
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always